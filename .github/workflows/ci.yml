name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# A newer push to the same PR makes an in-progress run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest   # WPF and DirectSound need Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build
        run: dotnet build MySoundBoard.sln -c Release -warnaserror

      # Runners have no audio device, so playback tests report Inconclusive rather than fail.
      - name: Test
        run: dotnet test MySoundBoard.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
